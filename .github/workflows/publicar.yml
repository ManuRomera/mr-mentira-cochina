name: Publicar
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validar etiqueta, manifiesto y código
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check
      - run: npm test
      - name: Compilar compendios
        run: node scripts/build.mjs
      - name: Empaquetar
        run: |
          node scripts/zip.mjs
          cp system.json dist/system.json
          # Sin el compendio la aventura no se instala; sin el arte, las escenas salen vacías.
          unzip -l dist/mr-mentira-cochina.zip | grep -q "packs/aventura"
          unzip -l dist/mr-mentira-cochina.zip | grep -q "assets/escenas/00-amanecer.webp"
          cp docs/MR-Mentira-Cochina.pdf dist/
          unzip -l dist/mr-mentira-cochina.zip | tail -1
      - name: Notas de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0==v{p=1;next} /^## /{p=0} p' CHANGELOG.md > dist/notas.md
          test -s dist/notas.md || echo "Versión $version." > dist/notas.md
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/mr-mentira-cochina.zip dist/system.json dist/MR-Mentira-Cochina.pdf --title "MR- ¡Mentira Cochina! $GITHUB_REF_NAME" --notes-file dist/notas.md
